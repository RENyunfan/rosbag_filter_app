name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - ros2_dev

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui]"
      - name: Run tests
        run: pytest

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build distributions
        run: python -m build
      - name: Validate metadata
        run: python -m twine check dist/*
      - name: Smoke test installed commands
        run: |
          python -m venv /tmp/rosbag-filter-smoke
          /tmp/rosbag-filter-smoke/bin/python -m pip install --no-deps dist/*.whl
          /tmp/rosbag-filter-smoke/bin/python -c "import importlib.metadata as m, sys; eps = {ep.name: ep.value for ep in m.distribution('rosbag-filter').entry_points}; expected = {'rosbag-filter': 'rosbag_filter.cli:main', 'rosbag-filter-app': 'rosbag_filter.gui:main'}; missing = {name: value for name, value in expected.items() if eps.get(name) != value}; sys.exit(f'Missing entry points: {missing}') if missing else print('Entry points OK:', sorted(expected))"
          test -x /tmp/rosbag-filter-smoke/bin/rosbag-filter-app
